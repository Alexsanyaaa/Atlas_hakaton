 $('main').innerHTML=`${pageHead('РАБОЧЕЕ ПРОСТРАНСТВО','Каталог товаров','Из исходного текста — в проверенные характеристики. Всё, что требует решения, в одном месте.',`<button class="button secondary" data-action="import">${icon('upload')}Импорт CSV / JSON</button><button class="button primary" data-action="create">${icon('plus')}Создать из текста</button>`,String(state.cards.length).padStart(2,'0'))}${automationBand(state.cards)}<div class="catalog-controls"><div class="status-filters" aria-label="Фильтр по статусу">${[['all','Все'],['review','На проверке'],['conflict','Противоречия'],['ready','Готово'],['new','Новые']].map(([v,l])=>`<button class="chip ${filter===v?'active':''}" data-action="filter" data-value="${v}" aria-pressed="${filter===v}">${l}<strong>${counts[v]}</strong></button>`).join('')}</div><div class="toolbar-right"><label class="search">${icon('search')}<input id="catalog-search" placeholder="Товар, бренд или SKU" aria-label="Поиск по каталогу" value="${esc(search)}"></label><select id="catalog-category" class="select" aria-label="Фильтр категории">${options([...new Set(state.cards.map(c=>c.category))],category,'Все категории')}</select><select id="catalog-sort" class="select" aria-label="Сортировка"><option value="attention" ${sort==='attention'?'selected':''}>Сначала важное</option><option value="name" ${sort==='name'?'selected':''}>По названию</option><option value="progress" ${sort==='progress'?'selected':''}>По готовности</option><option value="new" ${sort==='new'?'selected':''}>Сначала новые</option></select></div></div><div id="active-filters"></div><section class="catalog-frame"><div id="catalog-body"></div></section><div class="bottom-guides"><button class="guide-link" data-action="create" style="text-align:left;border:0;background:none;border-bottom:1px solid var(--line)"><b>01</b><div><strong>Есть только описание? Этого достаточно.</strong><p>Вставьте текст или загрузите TXT. Атлас подготовит структуру новой карточки.</p></div>${icon('arrow-up-right')}</button><a class="guide-link" href="#methods"><b>02</b><div><strong>Одно значение. Несколько способов найти.</strong><p>Посмотрите, как правила, NER и трансформер работают с одной карточкой.</p></div>${icon('arrow-up-right')}</a></div>`;
 $('catalog-search').oninput=e=>{search=e.target.value;page=1;renderTable();};$('catalog-category').onchange=e=>{category=e.target.value;page=1;renderTable();};$('catalog-sort').onchange=e=>{sort=e.target.value;page=1;renderTable();};renderTable();}
function catalogRows(){const rows=state.cards.filter(c=>(filter==='all'||C.status(c)===filter)&&(!category||c.category===category)&&(`${c.title} ${c.id} ${c.externalSku||''} ${c.attrs.find(a=>a.key==='brand')?.value||''}`).toLowerCase().includes(search.toLowerCase()));const ranks={conflict:0,review:1,new:2,ready:3};return rows.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title,'ru'):sort==='progress'?completed(a)/a.attrs.length-completed(b)/b.attrs.length:sort==='new'?String(b.createdAt).localeCompare(a.createdAt):ranks[C.status(a)]-ranks[C.status(b)]);}
function renderTable(){const rows=catalogRows(),pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));page=Math.min(page,pages);const visible=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);

 $('catalog-body').innerHTML=`${selected.size?`<div class="bulk"><span>Выбрано ${selected.size} карточек</span><button class="button light" data-action="batch-process">${icon('spark')}Обработать</button><button class="button secondary" data-action="export" data-selected="true">${icon('download')}Экспорт</button><button class="icon-button" data-action="clear-selection" aria-label="Снять выделение">${icon('x')}</button></div>`:''}<div class="table-wrap"><table class="catalog-table"><thead><tr><th><input id="select-page" type="checkbox" aria-label="Выбрать страницу" ${visible.length&&visible.every(c=>selected.has(c.id))?'checked':''}></th><th>Товар / SKU</th><th>Категория</th><th>Статус</th><th>Проверено полей</th><th>Источник решений</th><th></th></tr></thead><tbody>${visible.map(c=>`<tr data-open="${esc(c.id)}"><td><input type="checkbox" data-select="${esc(c.id)}" aria-label="Выбрать ${esc(c.title)}" ${selected.has(c.id)?'checked':''}></td><td><div class="product-cell">${art(c.type)}<div class="product-info"><strong title="${esc(c.title)}">${esc(c.title)}</strong><p><span>${esc(c.externalSku||c.id)}</span><span>·</span><span>${c.attrs.length} полей</span></p></div></div></td><td>${esc(c.category)}</td><td>${badge(C.status(c))}</td><td><div class="progress-mini"><div class="mini-track"><span style="width:${c.attrs.length?completed(c)/c.attrs.length*100:0}%"></span></div>${completed(c)} / ${c.attrs.length}</div></td><td><span class="method-label">${c.processed?`<strong>${c.attrs.some(a=>a.method==='transformer')?'Трансформер':'Правила'}</strong> + проверка`:'Ожидает обработки'}</span></td><td><button class="row-arrow" data-action="open" data-id="${esc(c.id)}" aria-label="Открыть ${esc(c.title)}">${icon('arrow-right')}</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':`<div class="empty"><h2>Ничего не нашлось</h2><p>Попробуйте другое название или уберите часть фильтров.</p><button class="button secondary" data-action="clear-filters">Сбросить фильтры</button></div>`}<div class="table-foot"><span>${rows.length?`${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,rows.length)} из ${rows.length}`:'0'} карточек</span><div class="detail-actions"><button class="text-button" data-action="export">${icon('download')}Экспорт подтверждённых</button><div class="pager"><button data-action="page" data-value="-1" ${page===1?'disabled':''} aria-label="Предыдущая страница">‹</button><span class="mono">${page} / ${pages}</span><button data-action="page" data-value="1" ${page===pages?'disabled':''} aria-label="Следующая страница">›</button></div></div></div>`;
 $('select-page').onchange=e=>{visible.forEach(c=>e.target.checked?selected.add(c.id):selected.delete(c.id));renderTable();};document.querySelectorAll('[data-select]').forEach(cb=>cb.onchange=()=>{cb.checked?selected.add(cb.dataset.select):selected.delete(cb.dataset.select);renderTable();});document.querySelectorAll('[data-open]').forEach(row=>row.onclick=e=>{if(e.target.closest('input,button'))return;openCard(row.dataset.open);});}
function openCard(id){activeId=id;activeField=null;sourceTab='text';location.hash='review/'+encodeURIComponent(id);}
function activeCard(){return state.cards.find(c=>c.id===activeId)||state.cards.find(c=>C.status(c)!=='ready')||state.cards[0];}
function quoteMarkup(text,value){if(!value)return esc(text);const i=text.toLocaleLowerCase().indexOf(value.toLocaleLowerCase());return i<0?esc(text):esc(text.slice(0,i))+`<strong>${esc(text.slice(i,i+value.length))}</strong>`+esc(text.slice(i+value.length));}
function sentenceFor(text,quote){const i=text.indexOf(quote);if(i<0)return quote;let start=Math.max(text.lastIndexOf('\n',i),text.lastIndexOf('. ',i))+1;if(start<0)start=0;let end=text.indexOf('. ',i+quote.length);if(end<0)end=text.indexOf('\n',i+quote.length);if(end<0)end=text.length;else end++;return text.slice(start,end).trim();}
function renderReview(){const c=activeCard();if(!c){$('main').innerHTML=`<div class="empty"><h2>Каталог пока пуст</h2><button class="button primary" data-action="create">Создать карточку</button></div>`;return;}activeId=c.id;if(activeField===null||activeField>=c.attrs.length)activeField=Math.max(0,c.attrs.findIndex(a=>!['auto','accepted','absent'].includes(a.state)));const a=c.attrs[activeField],n=completed(c),queue=state.cards.filter(x=>C.status(x)!=='ready');
 $('main').innerHTML=`<a class="back" href="#catalog">${icon('arrow-left')}Вернуться к каталогу</a><div class="review-head"><div class="review-identity">${art(c.type)}<div><span class="eyebrow">КОНТРОЛЬ ХАРАКТЕРИСТИК</span><h1>${esc(c.title)}</h1><div class="review-meta"><span class="mono">${esc(c.externalSku||c.id)}</span><span>${esc(c.category)}</span>${badge(C.status(c))}<button class="text-button" data-action="edit-card">Изменить карточку</button></div></div></div><div class="review-nav">${!c.processed?`<button class="button primary" data-action="process-card">${icon('spark')}Извлечь характеристики</button>`:''}<span class="queue-position">${Math.max(1,queue.findIndex(x=>x.id===c.id)+1)} / ${Math.max(1,queue.length)}</span><button class="button secondary" data-action="next-card">Следующая ${icon('arrow-right')}</button></div></div><div class="review-strip"><strong>${n} из ${c.attrs.length} полей проверено</strong><div class="thin-track"><span style="width:${c.attrs.length?n/c.attrs.length*100:0}%"></span></div><span>${c.attrs.filter(x=>x.state==='auto').length} — автоматически</span><button class="text-button" data-action="undo" ${undo.length?'':'disabled'}>${icon('refresh')}Отменить действие</button></div><div class="review-workspace"><div><section class="source-panel"><div class="source-toolbar"><div class="source-tabs"><button class="source-tab ${sourceTab==='text'?'active':''}" data-action="source-tab" data-value="text">Исходный текст</button><button class="source-tab ${sourceTab==='quotes'?'active':''}" data-action="source-tab" data-value="quotes">Цитаты <span class="mono">${c.attrs.filter(x=>C.evidence(x,c).length).length}</span></button></div><span class="source-id">ДОКУМЕНТ / 01</span></div>${sourceTab==='text'?renderSource(c,a):renderCitations(c)}<div class="source-foot">${icon('link')}Цитата связана с выбранной характеристикой. Проверьте контекст перед решением.</div></section></div><section><div class="attribute-heading"><h2>Характеристики</h2><span>${String(c.attrs.length).padStart(2,'0')} ПОЛЕЙ</span></div>${c.attrs.map((x,i)=>renderAttribute(x,i)).join('')}<div class="review-savebar"><span>Решения сохраняются после каждого действия</span><button class="button primary" data-action="save-card">${icon('check')}Сохранить карточку</button></div></section></div>`;}
function renderSource(c,a){const ev=C.evidence(a,c),sourceLines=c.description.split(/(?<=[.!?])\s+|\n+/).filter(Boolean);return`<div class="source-document"><div class="document-label">НАЗВАНИЕ</div><div class="document-title">${esc(c.title)}</div><div class="document-label">ОПИСАНИЕ</div><div class="document-body">${sourceLines.length?sourceLines.map((s,i)=>`<div class="document-line"><span>${String(i+1).padStart(2,'0')}</span><p>${esc(s)}</p></div>`).join(''):'Описание не добавлено'}</div><div class="citation-panel"><div class="citation-header"><span>ОСНОВАНИЕ ДЛЯ РЕШЕНИЯ</span><span class="citation-tag">↗ ${String(activeField+1).padStart(2,'0')} / ${esc(a.label)}</span></div>${ev.length?ev.map(e=>`<blockquote class="citation">${quoteMarkup(sentenceFor(c[e.source],e.quote),e.quote)}</blockquote><div class="citation-source">${icon('file')}${e.source==='title'?'Название товара':'Описание товара'}${e.value?' · '+esc(e.value):''}</div>`).join(''):`<p class="quote-empty">Подтверждающий фрагмент не найден. Можно заполнить поле вручную или подтвердить отсутствие значения.</p>`}</div></div>`;}
function renderCitations(c){return`<div class="all-citations">${c.attrs.map((a,i)=>{const ev=C.evidence(a,c);return ev.length?`<button data-action="field" data-index="${i}"><strong>${String(i+1).padStart(2,'0')} / ${esc(a.label)}</strong><span>«${esc(ev[0].quote)}»</span></button>`:'';}).join('')||'<div class="quote-empty">Цитаты пока не найдены</div>'}</div>`;}
function renderAttribute(a,i){const done=['auto','accepted','absent'].includes(a.state),r=C.recommend(a),isSelected=i===activeField;return`<article class="attribute-row ${isSelected?'selected':''}" aria-label="${esc(a.label)}"><div class="attr-main" data-action="field" data-index="${i}" tabindex="0" role="button" aria-label="Показать источник: ${esc(a.label)}"><div class="attr-label">${esc(a.label)}<span class="attr-ref">${String(i+1).padStart(2,'0')}</span><span class="attr-score">${a.edited?'ВРУЧНУЮ':Number.isFinite(a.score)?decimal(a.score,2)+' · оценка модели':'НЕТ ДАННЫХ'}</span></div><div class="attr-value-row"><span class="attr-value ${a.value?'':'unknown'}">${a.state==='absent'?'Не указано в источниках':esc(a.value|| (a.state==='rejected'?'Предложение отклонено':'Значение не найдено'))}</span><div class="attr-buttons"><button class="mini-button" data-action="edit-field" data-index="${i}" aria-label="Исправить: ${esc(a.label)}">${icon('edit')}</button>${!done?`<button class="mini-button" data-action="accept" data-index="${i}" aria-label="Принять: ${esc(a.label)}" ${!a.value||a.state==='conflict'?'disabled':''}>${icon('check')}</button><button class="mini-button reject" data-action="reject" data-index="${i}" aria-label="Отклонить: ${esc(a.label)}" ${!a.value?'disabled':''}>${icon('x')}</button>`:`<button class="mini-button" data-action="reopen" data-index="${i}" aria-label="Вернуть на проверку: ${esc(a.label)}">${icon('refresh')}</button>`}</div></div>${a.edited&&a.previousValue?`<div class="attr-raw">Было: <del>${esc(a.previousValue)}</del></div>`:''}<div class="decision-label ${done?'done':''}">${icon(done?'check':'link')}${done?r.title:METHOD_NAMES[a.method]||'Источник'}${!done?' · требуется решение':''}</div></div>${!done&&isSelected?`<div class="recommendation ${r.kind}">${icon(r.kind==='reject'?'x':r.kind==='accept'?'check':'info')}<div><strong>${r.title}</strong><p>${esc(r.detail)}</p>${a.suggested?`<button class="text-button" data-action="use-suggestion" data-index="${i}">Использовать «${esc(a.suggested)}» ${icon('arrow-right')}</button>`:''}</div></div>${a.alternatives?`<div class="alternatives">${a.alternatives.map((v,j)=>`<button class="alternative" data-action="choose-alternative" data-index="${i}" data-choice="${j}">Принять ${esc(v.value)}</button>`).join('')}</div>`:''}<button class="absence-button" data-action="confirm-absence" data-index="${i}">${icon('scan')}Подтвердить отсутствие в тексте</button>`:''}</article>`;}
function mutateField(index,action,value){const c=activeCard();if(!c)return;undo.push({id:c.id,attrs:C.clone(c.attrs),processed:c.processed});if(undo.length>30)undo.shift();try{C.decide(c.attrs[index],action,value);}catch(e){undo.pop();toast(e.message);return;}c.processed=true;activeField=index;activity(action,c,c.attrs[index].key);save();renderReview();toast(({accept:'Значение принято',edit:'Значение исправлено',reject:'Кандидат отклонён. Поле остаётся на проверке',absent:'Отсутствие значения подтверждено',reopen:'Поле возвращено на проверку'})[action]);}

async function readTxt(file){if(!file)return;try{if(!/\.txt$/i.test(file.name))throw Error('Выберите файл TXT');if(file.size>160000)throw Error('Файл слишком большой');const text=await file.text();if(text.includes('\uFFFD'))throw Error('Не удалось прочитать кодировку. Сохраните файл в UTF-8');if(!text.trim()||text.length>20000)throw Error('Нужен текст от 1 до 20 000 символов');createState.text=text;createState.fileName=file.name;createState.tab='txt';renderCreate();}catch(e){if($('create-error'))$('create-error').innerHTML=`<div class="error">${esc(e.message)}</div>`;}}
function bindDrop(id,fn){const e=$(id);if(!e)return;e.ondragover=v=>{v.preventDefault();e.classList.add('drag');};e.ondragleave=()=>e.classList.remove('drag');e.ondrop=v=>{v.preventDefault();e.classList.remove('drag');fn(v.dataTransfer.files[0]);};}

 if(s.step===2){body+=`<div class="success-line">${icon('check')}${esc(s.fileName)} · ${s.parsed.rows.length} строк</div><p class="modal-subtitle">Укажите, где находятся данные товара. Достаточно названия или описания.</p><div class="mapping-grid">${[['title','Название'],['description','Описание'],['category','Категория'],['sku','SKU / артикул']].map(([k,l])=>`<label for="map-${k}">${l}</label><select id="map-${k}" class="select"><option value="">Не использовать</option>${options(s.parsed.headers,s.mapping[k])}</select>`).join('')}</div><div class="import-preview">${rawPreview(s.parsed)}</div><div id="import-error"></div>`;actions=`<button class="text-button" data-action="import-back">${icon('arrow-left')}Другой файл</button><button class="button primary" data-action="import-preview">Проверить строки ${icon('arrow-right')}</button>`;}

 ].map(row=>`<tr>${row.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="section-title"><div><h2>Точность и покрытие правил</h2><p>Правила + база знаний · данные отчёта команды</p></div></div><section class="sheet"><label class="threshold-control">Порог принятия <input id="threshold" type="range" min="0" max="11" step="1" value="${thresholdIndex}" aria-label="Порог правил"><strong id="threshold-value">${decimal(RULE_THRESHOLDS[thresholdIndex][0],2)}</strong></label><div id="threshold-result">${thresholdResult()}</div></section>`;
 if($('compare-card'))$('compare-card').onchange=e=>{compareId=e.target.value;$('comparison-body').innerHTML=comparisonBody(state.cards.find(c=>c.id===compareId));};$('threshold').oninput=e=>{thresholdIndex=Number(e.target.value);$('threshold-value').textContent=decimal(RULE_THRESHOLDS[thresholdIndex][0],2);$('threshold-result').innerHTML=thresholdResult();};}
function comparisonBody(c){if(!c)return'';const original=C.SEEDS.find(x=>x.id===c.id)||c;return`<div class="table-section table-wrap"><table class="quality-table compare-table"><thead><tr><th>Характеристика</th><th>Правила</th><th>NER / CRF</th><th>Трансформер</th><th>LLM</th></tr></thead><tbody>${original.attrs.slice(0,5).map(a=>{let rules=a.state==='auto'?a.value:a.suggested||'',ner=a.key==='color'&&a.value==='белый'?'серебристый, белый':a.key==='model'&&a.score<.8?'':a.value;return`<tr><td>${esc(a.label)}</td>${[rules,ner,a.value].map(v=>`<td><span class="compare-value">${esc(v||'Не найдено')}</span>${v&&C.evidence(a,original).length?`<div class="compare-detail">Источник: «${esc(C.evidence(a,original)[0].quote)}»</div>`:''}</td>`).join('')}<td><span class="pending-result">В разработке</span></td></tr>`;}).join('')}</tbody></table></div><div class="detail-actions" style="margin-top:13px"><button class="text-button" data-action="open" data-id="${esc(c.id)}">Перейти к проверке ${icon('arrow-right')}</button><span class="metric-note">Показаны отдельные предложения. Итоговое значение выбирается при проверке.</span></div>`;}
function thresholdResult(){const r=RULE_THRESHOLDS[thresholdIndex];return`<div class="metric-ribbon" style="margin-bottom:0"><div class="ribbon-item"><small>Precision</small><span class="ribbon-value">${pct(r[1])}</span></div><div class="ribbon-item"><small>Recall</small><span class="ribbon-value">${pct(r[2])}</span></div><div class="ribbon-item"><small>Coverage</small><span class="ribbon-value">${pct(r[3])}</span></div></div>`;}
function renderDictionaries(){const types=['Все',...new Set(state.dictionary.map(d=>d.type))];$('main').innerHTML=`${pageHead('ЕДИНЫЙ ЯЗЫК КАТАЛОГА','Разные слова. Один смысл.','Приводите названия, единицы и варианты написания к общему формату.',`<button class="button primary" data-action="dict-add">${icon('plus')}Добавить правило</button>`)}<div class="dictionary-layout"><aside class="dictionary-types">${types.map(t=>`<button class="dictionary-type ${dictType===t?'active':''}" data-action="dict-type" data-value="${esc(t)}">${esc(t)}<span>${t==='Все'?state.dictionary.length:state.dictionary.filter(d=>d.type===t).length}</span></button>`).join('')}</aside><section><div class="dictionary-type-title"><h2>${dictType==='Все'?'Все преобразования':esc(dictType)}</h2><label class="search">${icon('search')}<input id="dict-search" placeholder="Найти вариант написания" aria-label="Поиск по словарю" value="${esc(dictQuery)}"></label></div><div class="table-section" id="dictionary-body"></div><div class="dictionary-preview"><label class="field-label" for="dict-preview">Проверьте преобразование на своём тексте</label><input id="dict-preview" class="input" placeholder="Например, фантом чёрный" value="фантом чёрный"><div id="preview-result"></div></div></section></div>`;$('dict-search').oninput=e=>{dictQuery=e.target.value;renderDictionaryRows();};$('dict-preview').oninput=renderDictionaryPreview;renderDictionaryRows();renderDictionaryPreview();}
function renderDictionaryRows(){const rows=state.dictionary.filter(d=>(dictType==='Все'||d.type===dictType)&&(`${d.source} ${d.value}`).toLowerCase().includes(dictQuery.toLowerCase()));$('dictionary-body').innerHTML=`<div class="table-wrap"><table class="dictionary-table"><thead><tr><th>Как написано</th><th>Как сохраняется</th><th>Тип</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr><td>${esc(d.source)}</td><td><strong>${esc(d.value)}</strong></td><td>${esc(d.type)}</td><td><div class="detail-actions"><button class="icon-button" data-action="dict-edit" data-id="${esc(d.id)}" aria-label="Изменить ${esc(d.source)}">${icon('edit')}</button><button class="icon-button" data-action="dict-delete" data-id="${esc(d.id)}" aria-label="Удалить ${esc(d.source)}">${icon('trash')}</button></div></td></tr>`).join('')||'<tr><td colspan="4">Подходящих записей нет</td></tr>'}</tbody></table></div>`;}
function renderDictionaryPreview(){const text=$('dict-preview').value,match=state.dictionary.find(d=>d.source.toLowerCase()===text.toLowerCase().trim());$('preview-result').innerHTML=`<div class="preview-result">${match?`<del>${esc(text)}</del>${icon('arrow-right')}<span>${esc(match.value)}</span>`:`<span>${esc(text||'Введите текст')}</span>`}</div><p class="form-help">${match?'Найдено точное соответствие словарю':'Точное правило не найдено. Исходное значение сохраняется.'}</p>`;}
function showDictionaryEditor(id){const d=state.dictionary.find(x=>x.id===id)||{source:'',value:'',type:dictType==='Все'?'Цвет':dictType};editState={dictId:id};openModal(id?'Изменить преобразование':'Новое преобразование','СЛОВАРЬ НОРМАЛИЗАЦИИ',`<form id="dict-form"><div class="form-group"><label class="field-label" for="dict-source">В исходном тексте</label><input id="dict-source" class="input" required maxlength="100" value="${esc(d.source)}" placeholder="Например, белого цвета"></div><div class="form-group"><label class="field-label" for="dict-value">Единое значение</label><input id="dict-value" class="input" required maxlength="100" value="${esc(d.value)}" placeholder="белый"></div><div class="form-group"><label class="field-label" for="dict-type">Тип</label><select id="dict-type" class="input">${options(['Цвет','Бренд','Единицы','Материал','Синоним характеристики'],d.type)}</select></div><div class="modal-actions"><button class="button secondary" type="button" data-action="close">Отмена</button><button class="button primary">Сохранить правило</button></div></form>`,'',true);}
function route(){const [name,id]=location.hash.slice(1).split('/');routeName=['catalog','review','analytics','dictionaries','methods'].includes(name)?name:'catalog';if(routeName==='review'){activeId=null;if(id)try{activeId=decodeURIComponent(id);}catch{}activeField=null;sourceTab='text';}document.querySelector('.main-nav').classList.remove('open');updateHeader();({catalog:renderCatalog,review:renderReview,analytics:renderAnalytics,dictionaries:renderDictionaries,methods:renderMethods}[routeName])();window.scrollTo(0,0);}
function runAction(action,el){const d=el.dataset;switch(action){
 case'menu':document.querySelector('.main-nav').classList.toggle('open');break;
 case'close':closeModal();break;case'create':startCreate();break;case'import':startImport();break;
 case'open':openCard(d.id);break;
 case'filter':filter=d.value;page=1;selected.clear();renderCatalog();break;
 case'clear-category':category='';$('catalog-category').value='';page=1;renderTable();break;
 case'clear-search':search='';$('catalog-search').value='';page=1;renderTable();break;
 case'clear-filters':filter='all';category='';search='';page=1;renderCatalog();break;
 case'page':page+=Number(d.value);renderTable();break;case'clear-selection':selected.clear();renderTable();break;
 case'batch-process':processSelected();break;
 case'process-card':{const c=activeCard();if(c.processed)break;Object.assign(c,C.extract(c,state.dictionary));activity('process',c,null);activeField=null;save();renderReview();toast('Характеристики подготовлены. Проверьте источники.');break;}
 case'export':showExport(d.selected==='true');break;
 case'export-download':{const rows=state.cards.filter(c=>d.selected!=='true'||selected.has(c.id));download('atlas-catalog.json',C.exportCards(rows));closeModal();toast(`Выгружено карточек: ${rows.length}`);break;}
 case'field':activeField=Number(d.index);renderReview();break;
 case'source-tab':sourceTab=d.value;renderReview();break;
 case'edit-field':showEdit(Number(d.index));break;
 case'edit-card':showEditCard();break;
 case'accept':case'reject':case'reopen':mutateField(Number(d.index),action);break;
 case'use-suggestion':{const a=activeCard().attrs[d.index];mutateField(Number(d.index),'edit',a.suggested);break;}
 case'choose-alternative':{const a=activeCard().attrs[d.index];mutateField(Number(d.index),'edit',a.alternatives[d.choice].value);break;}
 case'confirm-absence':editState={id:activeId,index:Number(d.index)};openModal('Подтвердить отсутствие?','РЕШЕНИЕ ПО ХАРАКТЕРИСТИКЕ',`<p class="modal-subtitle">Это отдельное решение: значение «${esc(activeCard().attrs[d.index].label)}» не указано в доступном тексте. Отклонение одного предложения само по себе не подтверждает отсутствие.</p>`,`<button class="button secondary" data-action="close">Вернуться к тексту</button><button class="button primary" data-action="absence-commit">Отсутствует в источниках</button>`,true);break;
 case'absence-commit':closeModal();mutateField(editState.index,'absent');break;
 case'undo':{const last=undo.pop();if(!last)return;const c=state.cards.find(c=>c.id===last.id);c.attrs=last.attrs;c.processed=last.processed;activeId=c.id;save();renderReview();toast('Последнее решение отменено');break;}
 case'next-card':{const q=state.cards.filter(c=>c.id!==activeId&&C.status(c)!=='ready');if(q.length)openCard(q[0].id);else toast('Других непроверенных карточек нет');break;}
 case'save-card':{save();const c=activeCard(),pending=c.attrs.length-completed(c);toast(pending?`Сохранено. Осталось решений: ${pending}`:'Карточка готова к выгрузке');break;}
 case'create-tab':if($('create-text'))createState.text=$('create-text').value;createState.tab=d.value;renderCreate();break;
 case'text-example':createState.text=TEXT_EXAMPLES[d.value];renderCreate();break;
 case'analyze-text':{createState.text=$('create-text').value;if(!createState.text.trim()){$('create-error').innerHTML='<div class="error">Добавьте описание товара</div>';break;}try{createState.result=C.extract({text:createState.text},state.dictionary);openModal('Формируем карточку','ОБРАБОТКА ТЕКСТА','<div class="processing"><span class="spinner"></span><h3>Находим структуру в тексте</h3><p>Название → категория → характеристики</p></div>');setTimeout(()=>{createState.step=2;renderCreate();},650);}catch(e){$('create-error').innerHTML=`<div class="error">${esc(e.message)}</div>`;}break;}
 case'create-back':createState.step=1;renderCreate();break;
 case'create-commit':{const title=$('new-title').value.trim();if(!title){$('create-error').innerHTML='<div class="error">Укажите название</div>';break;}const c={...createState.result,title,id:'TXT-'+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString(),inputKind:createState.tab==='txt'?'txt':'paste'};state.cards.unshift(c);activity('create',c,null);save();closeModal();openCard(c.id);toast('Карточка создана. Проверьте предложения по источникам.');break;}
 case'import-sample':download('atlas-import.csv','Название;Описание;Категория;SKU\n"Стул COMFUR бежевый";"Материал каркаса — металл. Размеры 45×52×83 см.";"Мебель";"CHAIR-01"\n"Смартфон Samsung Galaxy S23+";"Оперативная память — 8 ГБ. Встроенная память — 256 ГБ. Цвет чёрный.";"Смартфоны";"PHONE-01"','text/csv');break;
 case'import-preview':try{for(const key of Object.keys(importState.mapping))importState.mapping[key]=$('map-'+key).value;const used=Object.values(importState.mapping).filter(Boolean);if(new Set(used).size!==used.length)throw Error('Одна колонка не может заполнять разные поля');importState.rows=C.mapRows(importState.parsed.rows,importState.mapping);importState.step=3;renderImport();}catch(e){$('import-error').innerHTML=`<div class="error">${esc(e.message)}</div>`;}break;
 case'import-back':importState.step=Math.max(1,importState.step-1);renderImport();break;
 case'import-commit':{const now=Date.now();importState.rows.forEach((r,i)=>{const cat=C.CATEGORY_FIELDS[r.category]?r.category:'Без категории';const c={...r,id:'IMP-'+now.toString(36)+'-'+i,createdAt:new Date().toISOString(),type:'generic',processed:false,attrs:(C.CATEGORY_FIELDS[cat]||C.CATEGORY_FIELDS['Без категории']).map(k=>C.field(k,'','','unknown',null))};state.cards.unshift(c);activity('import',c,null);});save();closeModal();filter='new';page=1;search='';category='';if(routeName==='catalog')renderCatalog();else location.hash='catalog';toast(`Добавлено товаров: ${importState.rows.length}. Выберите их для обработки.`);break;}
 case'evaluation':evaluation=d.value;$('evaluation-body').innerHTML=evaluationBody();document.querySelectorAll('[data-action="evaluation"]').forEach(b=>b.classList.toggle('active',b.dataset.value===evaluation));bindEvaluation();break;
 case'dict-type':dictType=d.value;renderDictionaries();break;case'dict-add':showDictionaryEditor(null);break;case'dict-edit':showDictionaryEditor(d.id);break;
 case'dict-delete':editState={deleteDict:d.id};openModal('Удалить преобразование?','СЛОВАРЬ',`<p class="modal-subtitle">Правило «${esc(state.dictionary.find(x=>x.id===d.id)?.source)}» перестанет применяться при обработке новых карточек. Уже проверенные значения сохранятся.</p>`,`<button class="button secondary" data-action="close">Отмена</button><button class="button danger" data-action="dict-delete-commit">Удалить правило</button>`,true);break;
 case'dict-delete-commit':state.dictionary=state.dictionary.filter(x=>x.id!==editState.deleteDict);save();closeModal();renderDictionaries();toast('Правило удалено');break;
 case'automation-info':openModal('Как считается автоматизация','О ПРОЦЕССЕ',`<p class="modal-subtitle">Доля полей, принятых автоматически, от всех применимых полей в выбранных карточках.</p><div class="edit-evidence">Автоматически принятые поля / все поля × 100%</div><p class="form-help">Подготовленное предложение ещё не считается автоматически принятым. Исправление человеком переводит поле в ручные решения. Подтверждённое отсутствие учитывается отдельно как ручная проверка.</p>`,`<button class="button primary" data-action="close">Понятно</button>`,true);break;
 case'guide':openModal('От текста — к проверенной карточке','КАК РАБОТАЕТ АТЛАС',`${[['01','Добавьте исходные данные','Вставьте текст, загрузите TXT или импортируйте таблицу CSV/JSON.'],['02','Разберите предложения','Выберите поле, прочитайте цитату и примите, исправьте или отклоните значение.'],['03','Выгрузите подтверждённое','Экспорт включает принятые значения, источники и происхождение каждого решения.']].map(([n,t,p])=>`<div class="step-guide"><b>${n}</b><div><h3>${t}</h3><p>${p}</p></div></div>`).join('')}`,`<button class="button primary" data-action="close">Начать работу</button>`);break;
 case'reset':openModal('Вернуть исходный каталог?','ВОССТАНОВЛЕНИЕ',`<p class="modal-subtitle">Ваши локальные изменения, импортированные карточки и новые правила будут заменены исходным набором. Сначала сохраните нужные данные через экспорт.</p>`,`<button class="button secondary" data-action="close">Отмена</button><button class="button danger" data-action="reset-commit">Восстановить каталог</button>`,true);break;
 case'reset-commit':state={cards:C.clone(C.SEEDS),dictionary:C.clone(C.DICTIONARY),activity:[]};undo=[];selected.clear();filter='all';search='';category='';page=1;save();closeModal();if(location.hash==='#catalog')route();else location.hash='catalog';toast('Исходный каталог восстановлен');break;
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;runAction(b.dataset.action,b);});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.attr-main')){e.preventDefault();runAction('field',e.target);}});
document.addEventListener('submit',e=>{if(e.target.id==='edit-field-form'){e.preventDefault();const value=$('field-value').value.trim();if(!value)return;closeModal();mutateField(editState.index,'edit',value);}if(e.target.id==='edit-card-form'){e.preventDefault();const c=activeCard();c.title=$('card-title').value.trim();c.category=$('card-category').value;for(const key of C.CATEGORY_FIELDS[c.category])if(!c.attrs.some(a=>a.key===key))c.attrs.push(C.field(key,'','','unknown',null));save();closeModal();renderReview();toast('Карточка обновлена');}if(e.target.id==='dict-form'){e.preventDefault();const source=$('dict-source').value.trim(),value=$('dict-value').value.trim(),type=$('dict-type').value;if(!source||!value)return;const dup=state.dictionary.find(x=>x.id!==editState.dictId&&x.source.toLowerCase()===source.toLowerCase());if(dup){toast('Для этого написания уже есть правило');return;}const old=state.dictionary.find(d=>d.id===editState.dictId);if(old)Object.assign(old,{source,value,type});else state.dictionary.push({id:'dict-'+Date.now(),source,value,type});save();closeModal();renderDictionaries();toast('Правило сохранено');}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[e.dataset.icon]||ICONS.file}</svg>`);
window.addEventListener('hashchange',route);route();

</script></body></html>
